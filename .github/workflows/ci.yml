name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR supersedes the run in flight, so cancel it rather than
# let both occupy the org's concurrent-job slots. Pushes to main are never cancelled:
# every main commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only ever reads the checkout. Without an explicit
# block the token inherits the org default, which is often read-write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
